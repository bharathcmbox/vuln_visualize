# VIRTUAL PATCH VP-2026-001  (illustrative, lab only)
# Target : POST /rest/user/login  (deliberately vulnerable demo app)
# Class  : authentication-bypass via the email field
# Model  : positive security — email field must match an email shape
# Expiry : REMOVE once the upstream code fix (parameterized query) ships.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1010001,phase:2,deny,status:403,log,\
t:none,msg:'VP-2026-001 login email field failed positive-model check',\
tag:'virtual-patch',tag:'expiry-required',chain"
    SecRule REQUEST_URI "@beginsWith /rest/user/login" "chain"
        SecRule ARGS:json.email "!@rx ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" "t:none"
